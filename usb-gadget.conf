# ============================================================
# Raspberry Pi Zero 2 W - USB ConfigFS Gadget
# ============================================================

#
# Ethernet profile
#
# ecm   -> macOS / Linux
# rndis -> Windows
#
PROFILE=ecm

#
# CDC ACM serial port
#
ENABLE_ACM=yes

#
# Export the REAL boot partition as USB Mass Storage.
#
ENABLE_BOOT_STORAGE=yes

#
# Boot partition.
# Adjust these if lsblk/findmnt show different values.
#
BOOT_STORAGE_DEVICE=/dev/mmcblk0p1
BOOT_STORAGE_MOUNT=/boot/firmware

#
# no = host can modify config.txt, cmdline.txt, etc.
# yes = host sees boot partition read-only
#
BOOT_STORAGE_RO=no

#
# USB Ethernet address on the Raspberry.
#
USB_ADDRESS=192.168.2.3/24

#
# USB gateway. With macOS Internet Sharing, this is normally the
# address assigned to the Mac's shared USB/Ethernet interface.
USB_GATEWAY=192.168.2.1

# Optional space-separated DNS servers. Leave empty to preserve the existing
# DNS configuration (for example, if another component already sets 8.8.8.8).
USB_DNS=
#

#
# USB identity
#
MANUFACTURER="Kali Linux"
PRODUCT="Raspberry Pi Zero 2 W"

#
# Lab/personal gadget VID/PID.
#
ID_VENDOR=0x1d6b
ID_PRODUCT=0x0104

BCD_DEVICE=0x0100
BCD_USB=0x0200

#
# USB configuration MaxPower in mA.
#
MAX_POWER_MA=250
